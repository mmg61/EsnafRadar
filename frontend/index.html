<!doctype html>
<html lang="tr" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EsnafRadar</title>
    <script>
      (function () {
        var palettes = {
          midnight: { bg: '#0F172A', primary: '#10B981', stroke: '#34D399' },
          forest:   { bg: '#35513A', primary: '#5E7F61', stroke: '#FFF8E7' },
          ocean:    { bg: '#1E3A8A', primary: '#2563EB', stroke: '#93C5FD' },
          anthracite: { bg: '#18181B', primary: '#D97706', stroke: '#FBBF24' }
        };
        try {
          var saved = localStorage.getItem('esnafradar_theme_v2');
          var theme = palettes[saved] ? saved : 'midnight';
          document.documentElement.setAttribute('data-theme', theme);
          var p = palettes[theme];
          var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">' +
            '<circle cx="12" cy="12" r="11.5" fill="' + p.bg + '"/>' +
            '<circle cx="12" cy="12" r="11.5" fill="' + p.primary + '" fill-opacity="0.25" stroke="' + p.primary + '" stroke-width="1" stroke-opacity="0.5"/>' +
            '<g stroke="' + p.stroke + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/>' +
            '<path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/>' +
            '<circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></g></svg>';
          var link = document.getElementById('dynamic-favicon');
          if (link) {
            link.setAttribute('href', 'data:image/svg+xml;utf8,' + encodeURIComponent(svg));
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'midnight');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
